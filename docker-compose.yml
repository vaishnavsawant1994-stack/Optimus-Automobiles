name: deccan-wheels

services:
  postgres:
    image: postgres:17-alpine
    container_name: deccan-wheels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deccan_wheels}
      POSTGRES_USER: ${POSTGRES_USER:-deccan_wheels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deccan_wheels_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deccan_wheels_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deccan_wheels} -d ${POSTGRES_DB:-deccan_wheels}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  deccan_wheels_postgres_data:
    name: deccan_wheels_postgres_data

